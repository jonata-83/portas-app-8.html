const { useState, useEffect, useRef, useMemo } = React;
const STORAGE_KEY = "portas-app-v15";

function useLongPress(onLongPress, ms = 550) {
  const timerRef = useRef(null);
  const movedRef = useRef(false);
  const start = () => { movedRef.current = false; timerRef.current = setTimeout(() => { if (!movedRef.current) onLongPress(); }, ms); };
  const move = () => { movedRef.current = true; clear(); };
  const clear = () => { if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; } };
  return { onTouchStart: start, onTouchMove: move, onTouchEnd: clear, onTouchCancel: clear };
}

function BarChart({ desp, receita, lucro, theme }) {
  const max = Math.max(desp, receita, Math.abs(lucro), 1);
  const maxBarHeight = 100;
  const hDesp = (desp / max) * maxBarHeight;
  const hRec = (receita / max) * maxBarHeight;
  const hLuc = (Math.abs(lucro) / max) * maxBarHeight;
  const lucColor = lucro >= 0 ? "#22c55e" : "#ff6b6b";
  return (
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:20,margin:"4px 0 4px"}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
        <span style={{fontSize:12,color:"#9ca3af",fontWeight:700}}>{formatShortNum(desp)}</span>
        <div style={{width:42,height:`${hDesp}px`,background:"#ff6b6b",borderRadius:"8px 8px 0 0",minHeight:6,transition:"height 0.6s ease"}} />
        <span style={{fontSize:11,color:"#ff6b6b",fontWeight:700}}>Desp</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
        <span style={{fontSize:12,color:"#9ca3af",fontWeight:700}}>{formatShortNum(receita)}</span>
        <div style={{width:42,height:`${hRec}px`,background:"#22c55e",borderRadius:"8px 8px 0 0",minHeight:6,transition:"height 0.6s ease"}} />
        <span style={{fontSize:11,color:"#22c55e",fontWeight:700}}>Rec</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
        <span style={{fontSize:12,color:"#9ca3af",fontWeight:700}}>{formatShortNum(Math.abs(lucro))}</span>
        <div style={{width:42,height:`${hLuc}px`,background:lucColor,borderRadius:"8px 8px 0 0",minHeight:6,transition:"height 0.6s ease"}} />
        <span style={{fontSize:11,color:lucColor,fontWeight:700}}>{lucro>=0?"Luc":"Prej"}</span>
      </div>
    </div>
  );
}

function EntryCard({ e, deleteConfirm, setDeleteConfirm, handleDelete, handleEdit, filterType, setFilterType, filterDoorName, setFilterDoorName }) {
  const lastTap = useRef(0);
  const [flash, setFlash] = useState(false);
  const isConfirm = deleteConfirm === e.id;

  const longPress = useLongPress(() => {
    if (navigator.vibrate) navigator.vibrate(60);
    setDeleteConfirm(e.id);
  });

  function handleTap() {
    const now = Date.now();
    if (now - lastTap.current < 320) {
      setFlash(true);
      setTimeout(() => setFlash(false), 300);
      handleEdit(e);
    }
    lastTap.current = now;
  }

  return (
    <div
      {...longPress}
      onTouchEnd={(ev) => { longPress.onTouchEnd(ev); handleTap(); }}
      style={{
        ...s.entryCard,
        background: isConfirm ? "#2d1515" : flash ? "#1e3a5f" : "#1f2937",
        transition: "background 0.2s",
        userSelect: "none"
      }}
    >
      <div style={s.entryLeft}>
        {(e.type==="despesa") && (
          <button style={{...s.emojiFilterBtn, ...(filterType===e.expType?s.emojiFilterActive:{})}}
            onTouchStart={(ev)=>ev.stopPropagation()}
            onTouchEnd={(ev)=>{ev.stopPropagation();setFilterType(filterType===e.expType?null:e.expType);}}>
            {EXPENSE_TYPES.find(t=>t.id===e.expType)?.emoji||"💰"}
          </button>
        )}
        <div style={{flex:1}}>
          <div style={s.entryName}>
            {e.type==="porta"||e.type==="janela" ? (
              <>
                <span style={{color:"#9ca3af",fontSize:13,fontWeight:700}}>{e.qtd||""} un</span>
                {(e.nome||e.desc) && <span> · </span>}
                {e.nome && (
                  <span style={{...s.doorNameTag, ...(filterDoorName===e.nome?s.doorNameTagActive:{})}}
                    onTouchStart={(ev)=>ev.stopPropagation()}
                    onTouchEnd={(ev)=>{ev.stopPropagation();setFilterDoorName(filterDoorName===e.nome?null:e.nome);}}>
                    {e.nome}
                  </span>
                )}
              </>
            ) : (
              <>
                {EXPENSE_TYPES.find(t=>t.id===e.expType)?.label}
                {e.fornecedor && <span style={{color:"#6b7280",fontSize:12,marginLeft:6}}>— {e.fornecedor}</span>}
              </>
            )}
          </div>
          {e.marceneiro && <div style={{fontSize:12,color:"#fbbf24",marginTop:3,fontWeight:600}}>👷 {e.marceneiro}</div>}
          {e.desc && <div style={s.entryDesc}>{e.desc}</div>}
          {e.type==="despesa" && e.volM3 > 0 && (
            <div style={{fontSize:12,color:"#60b4f7",marginTop:3,fontWeight:600}}>
              📐 {e.volM3.toFixed(3)} m³ {e.vrM3 > 0 && `× ${formatBRL(e.vrM3)}/m³`}
            </div>
          )}
          <div style={s.entryDate}>{formatDate(e.date)}</div>
        </div>
      </div>
      <div style={s.entryRight}>
        <span style={{color:e.type==="porta"?"#22c55e":e.type==="janela"?"#60b4f7":"#ff6b6b", fontWeight:700, fontSize:15}}>
          {e.type==="despesa"?"- ":"+ "}{formatBRL(e.valor)}
        </span>
        {isConfirm && (
          <div style={s.delRow}>
            <button style={s.btnDelOk}
              onTouchStart={(ev)=>ev.stopPropagation()}
              onTouchEnd={(ev)=>{ev.stopPropagation();handleDelete(e.id);}}>Excluir</button>
            <button style={s.btnDelNo}
              onTouchStart={(ev)=>ev.stopPropagation()}
              onTouchEnd={(ev)=>{ev.stopPropagation();setDeleteConfirm(null);}}>Não</button>
          </div>
        )}
      </div>
    </div>
  );
}

function MonthSeparator({ date }) {
  const [y, m] = date.split("-");
  const months = ["","JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  return (
    <div style={{display:"flex",alignItems:"center",gap:10,margin:"16px 0 10px"}}>
      <div style={{flex:1,height:1,background:"#374151"}} />
      <span style={{fontSize:11,color:"#6b7280",fontWeight:800,letterSpacing:1}}>{months[parseInt(m)]} / {y}</span>
      <div style={{flex:1,height:1,background:"#374151"}} />
    </div>
  );
}

function EspecieCard({ esp, st, onOpen, onDelete, formatBRLInt, formatBRL }) {
  const [confirmDel, setConfirmDel] = useState(false);
  const movedRef = useRef(false);
  const startY = useRef(0);

  const longPress = useLongPress(() => {
    if (navigator.vibrate) navigator.vibrate(60);
    setConfirmDel(true);
  });

  if (confirmDel) return (
    <div style={{...s.especieCard, background:"#2d1515"}}>
      <div style={{color:"#fca5a5",fontWeight:700,fontSize:15,marginBottom:12}}>Excluir <strong>{esp}</strong> e todos os lançamentos?</div>
      <div style={{display:"flex",gap:10}}>
        <button style={{...s.btnDelOk, flex:1, padding:"10px", fontSize:14, borderRadius:10}}
          onTouchStart={(ev)=>ev.stopPropagation()} onClick={onDelete}>Excluir tudo</button>
        <button style={{...s.btnDelNo, flex:1, padding:"10px", fontSize:14, borderRadius:10}}
          onTouchStart={(ev)=>ev.stopPropagation()} onClick={()=>setConfirmDel(false)}>Cancelar</button>
      </div>
    </div>
  );

  const totalQtd = st.qtdPort + st.qtdJan;
  const margem = st.receita > 0 ? ((st.lucro / st.receita) * 100) : 0;

  return (
    <div
      {...longPress}
      onTouchStart={(ev) => { longPress.onTouchStart(ev); movedRef.current = false; startY.current = ev.touches[0].clientY; }}
      onTouchMove={(ev) => { longPress.onTouchMove(ev); if (Math.abs(ev.touches[0].clientY - startY.current) > 8) movedRef.current = true; }}
      onTouchEnd={(ev) => { longPress.onTouchEnd(ev); if (!movedRef.current) onOpen(); }}
      style={s.especieCard}
    >
      <div style={s.cardTop}>
        <span style={s.cardName}>{esp}</span>
        <span style={{...s.cardLucroVal, color:st.lucro>=0?"#22c55e":"#ff6b6b"}}>{st.lucro>=0?"↑":"↓"} {formatBRLInt(Math.abs(st.lucro))} ›</span>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <span style={{fontSize:13,color:"#9ca3af",background:"#111827",padding:"5px 12px",borderRadius:8,fontWeight:700}}>
          Margem: <span style={{color:st.lucro>=0?"#22c55e":"#ff6b6b",fontWeight:900}}>{margem.toFixed(1)}%</span>
        </span>
        {totalQtd > 0 && (
          <span style={{fontSize:13,color:"#9ca3af",background:"#111827",padding:"5px 12px",borderRadius:8,fontWeight:700}}>
            Custo/un: <span style={{color:"#e5e7eb",fontWeight:800}}>{formatBRL(st.desp / totalQtd)}</span>
          </span>
        )}
        {st.desp > 0 && (
          <span style={{fontSize:13,color:"#9ca3af",background:"#111827",padding:"5px 12px",borderRadius:8,fontWeight:700}}>
            Retorno: <span style={{color:st.lucro>=0?"#22c55e":"#ff6b6b",fontWeight:900}}>{st.retornoPct.toFixed(1)}%</span>
          </span>
        )}
        {st.qtdPort > 0 && (
          <span style={{fontSize:13,color:"#9ca3af",background:"#111827",padding:"5px 12px",borderRadius:8,fontWeight:700}}>
            Lucro/porta: <span style={{color:st.lucro>=0?"#22c55e":"#ff6b6b",fontWeight:800}}>{formatBRL(st.lucroPorPorta)}</span>
          </span>
        )}
      </div>
      <div style={s.cardStatsRow}>
        <div style={s.cardStatCol}>
          <span style={s.cardStatLabel}>💸 Despesas</span>
          <span style={{...s.cardStatVal, color:"#ff6b6b"}}>{formatBRLInt(st.desp)}</span>
        </div>
        <div style={s.cardStatDivider}/>
        <div style={s.cardStatCol}>
          <span style={s.cardStatLabel}>🚪 Portas</span>
          {st.qtdPort>0 && <span style={s.cardStatQtd}>{st.qtdPort} un</span>}
          <span style={{...s.cardStatVal, color:"#22c55e"}}>{formatBRLInt(st.port)}</span>
        </div>
        {st.jan>0 && <><div style={s.cardStatDivider}/><div style={s.cardStatCol}>
          <span style={s.cardStatLabel}>🪟 Janelas</span>
          {st.qtdJan>0 && <span style={s.cardStatQtd}>{st.qtdJan} un</span>}
          <span style={{...s.cardStatVal, color:"#60b4f7"}}>{formatBRLInt(st.jan)}</span>
        </div></>}
      </div>
    </div>
  );
}

];

function formatBRLInt(val) {
  return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val || 0);
}
function formatBRL(val) {
  return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(val || 0);
}
function formatShortNum(val) {
  const v = val || 0;
  if (v === 0) return "0";
  if (Math.abs(v) >= 1000000) return `${(v / 1000000).toLocaleString("pt-BR", { minimumFractionDigits: v % 1000000 === 0 ? 0 : 1, maximumFractionDigits: 1 })} mi`;
  if (Math.abs(v) >= 1000) return `${(v / 1000).toLocaleString("pt-BR", { minimumFractionDigits: v % 1000 === 0 ? 0 : 1, maximumFractionDigits: 1 })} mil`;
  return new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v);
}
function formatShort(val) {
  const v = val || 0;
  if (v === 0) return "R$ 0";
  if (Math.abs(v) >= 1000000) return `R$ ${(v / 1000000).toLocaleString("pt-BR", { minimumFractionDigits: v % 1000000 === 0 ? 0 : 1, maximumFractionDigits: 1 })} mi`;
  if (Math.abs(v) >= 1000) return `R$ ${(v / 1000).toLocaleString("pt-BR", { minimumFractionDigits: v % 1000 === 0 ? 0 : 1, maximumFractionDigits: 1 })} mil`;
  return formatBRL(v);
}
function today() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}/${m}/${y}`;
}

const storage = {
  get: (key) => {
    try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; }
  },
  set: (key, value) => {
    try { localStorage.setItem(key, value); return true; } catch { return null; }
  }
};

function App() {
  const [data, setData] = useState({ entries: [] });
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("list");
  const [mainTab, setMainTab] = useState("especies");
  const [especieAtiva, setEspecieAtiva] = useState(null);
  const [subTab, setSubTab] = useState("despesas");
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [saved, setSaved] = useState(false);
  const [form, setForm] = useState({ type: "despesa", expType: "tora", especie: "", nome: "", desc: "", fornecedor: "", marceneiro: "", valor: "", qtd: "", valorUnit: "", m3: "", vrM3: "", date: today() });
  const [theme, setTheme] = useState(THEMES[0]);
  const [headerVisible, setHeaderVisible] = useState(true);
  const lastScrollY = useRef(0);
  const [showThemePicker, setShowThemePicker] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [filterType, setFilterType] = useState(null);
  const [filterDoorName, setFilterDoorName] = useState(null);
  const [searchText, setSearchText] = useState("");
  const [renamingEspecie, setRenamingEspecie] = useState(false);
  const [renameValue, setRenameValue] = useState("");
  const [formDirty, setFormDirty] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    try {
      const r = storage.get(STORAGE_KEY);
      if (r?.value) setData(JSON.parse(r.value));
      const t = storage.get(THEME_KEY);
      if (t?.value) { const found = THEMES.find(th=>th.id===t.value); if(found) setTheme(found); }
    } catch {}
    setLoading(false);
  }, []);

  useEffect(() => {
    const handleScroll = () => {
      const currentY = window.scrollY;
      if (currentY < 10) { setHeaderVisible(true); }
      else if (currentY < lastScrollY.current) { setHeaderVisible(true); }
      else if (currentY > lastScrollY.current + 5) { setHeaderVisible(false); setShowThemePicker(false); }
      lastScrollY.current = currentY;
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  useEffect(() => {
    if (!formDirty) return;
    const handler = (e) => {
      e.preventDefault();
      e.returnValue = "";
    };
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, [formDirty]);

  function persist(newData) {
    setData(newData);
    try { storage.set(STORAGE_KEY, JSON.stringify(newData)); } catch {}
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `portas-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (imported && Array.isArray(imported.entries)) {
          if (confirm(`Restaurar backup com ${imported.entries.length} lançamentos? Isso substituirá todos os dados atuais.`)) {
            persist(imported);
            alert("Backup restaurado com sucesso!");
          }
        } else {
          alert("Arquivo inválido.");
        }
      } catch {
        alert("Erro ao ler o arquivo.");
      }
    };
    reader.readAsText(file);
  }

  function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });
    const now = new Date().toLocaleDateString("pt-BR");
    doc.setFillColor(30, 58, 138);
    doc.rect(0, 0, 595, 60, "F");
    doc.setTextColor(255,255,255);
    doc.setFontSize(20); doc.setFont("helvetica","bold");
    doc.text("Controle de Portas e Janelas", 40, 38);
    doc.setFontSize(10); doc.setFont("helvetica","normal");
    doc.text(`Emitido em ${now}`, 595-40, 38, { align:"right" });
    const allEspecies = [...new Set(data.entries.map(e => e.especie))].sort();
    const rows = allEspecies.map(esp => {
      const st = stats(esp);
      const margem = st.receita > 0 ? ((st.lucro / st.receita) * 100).toFixed(1) + "%" : "0%";
      return [
        esp,
        `R$ ${st.desp.toLocaleString("pt-BR")}`,
        `R$ ${st.port.toLocaleString("pt-BR")}`,
        st.qtdPort > 0 ? `${st.qtdPort} un` : "-",
        `R$ ${st.jan.toLocaleString("pt-BR")}`,
        st.qtdJan > 0 ? `${st.qtdJan} un` : "-",
        st.lucro >= 0 ? `+ ${st.lucro.toLocaleString("pt-BR")}` : `- ${Math.abs(st.lucro).toLocaleString("pt-BR")}`,
        margem
      ];
    });
    doc.autoTable({
      startY: 80,
      head: [["Espécie","Despesas","Portas R$","Portas Un","Janelas R$","Janelas Un","Lucro/Prejuízo","Margem"]],
      body: rows,
      foot: [[
        "TOTAL",
        `R$ ${totalDesp.toLocaleString("pt-BR")}`,
        `R$ ${totalPort.toLocaleString("pt-BR")}`,
        `${totalQtdGeralPort} un`,
        `R$ ${totalJan.toLocaleString("pt-BR")}`,
        `${totalQtdGeralJan} un`,
        lucroGeral >= 0 ? `+ ${lucroGeral.toLocaleString("pt-BR")}` : `- ${Math.abs(lucroGeral).toLocaleString("pt-BR")}`,
        totalReceita > 0 ? ((lucroGeral / totalReceita) * 100).toFixed(1) + "%" : "0%"
      ]],
      styles:{ fontSize:9, cellPadding:6 },
      headStyles:{ fillColor:[255,255,255], textColor:[30,58,138], fontStyle:"bold", lineWidth:0.5, lineColor:[200,200,200] },
      footStyles:{ fillColor:[255,255,255], textColor:[30,30,30], fontStyle:"bold", lineWidth:0.5, lineColor:[200,200,200] },
      alternateRowStyles:{ fillColor:[255,255,255] },
      columnStyles:{ 6:{ fontStyle:"bold" }, 4:{ halign:"right" } },
      didParseCell: (data) => {
        if (data.column.index === 6 && data.section === "body") {
          const val = data.cell.raw || "";
          if (String(val).startsWith("+")) data.cell.styles.textColor = [21,128,61];
          else if (String(val).startsWith("-")) data.cell.styles.textColor = [185,28,28];
        }
        if (data.section === "foot" && data.column.index === 6) {
          data.cell.styles.textColor = lucroGeral>=0?[21,128,61]:[185,28,28];
        }
      }
    });
    compartilharPDFPortas(doc, `portas-${now.replace(/\//g,"-")}.pdf`);
  }

  function exportPDFEspecie() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });
    const now = new Date().toLocaleDateString("pt-BR");

    doc.setTextColor(20, 20, 20);
    doc.setFontSize(20); doc.setFont("helvetica","bold");
    doc.text(especieAtiva || "", 40, 36);
    doc.setFontSize(9); doc.setFont("helvetica","normal");
    doc.setTextColor(100, 100, 100);
    doc.text(`Emitido em ${now}`, 595-40, 36, { align:"right" });

    doc.setDrawColor(180, 180, 180);
    doc.setLineWidth(0.5);
    doc.line(40, 44, 555, 44);

    const st = statsAtiva;
    const margem = st.receita > 0 ? ((st.lucro / st.receita) * 100).toFixed(1) + "%" : "0%";
    doc.setTextColor(60,60,60); doc.setFontSize(9);
    doc.text(`Despesas: R$ ${st.desp.toLocaleString("pt-BR")}   Portas: R$ ${st.port.toLocaleString("pt-BR")} (${st.qtdPort} un)   Janelas: R$ ${st.jan.toLocaleString("pt-BR")} (${st.qtdJan} un)`, 40, 58);
    const lucroText = st.lucro >= 0 ? `Lucro: R$ ${st.lucro.toLocaleString("pt-BR")}  |  Margem: ${margem}` : `Prejuízo: R$ ${Math.abs(st.lucro).toLocaleString("pt-BR")}`;
    doc.setFont("helvetica","bold");
    if (st.lucro >= 0) { doc.setTextColor(21, 128, 61); } else { doc.setTextColor(185, 28, 28); }
    doc.text(lucroText, 40, 72);

    const allEntries = data.entries
      .filter(e => e.especie === especieAtiva)
      .sort((a, b) => a.date.localeCompare(b.date));

    const totalEntradas = allEntries.filter(e => e.type !== "despesa").reduce((s,e)=>s+e.valor,0);
    const totalSaidas   = allEntries.filter(e => e.type === "despesa").reduce((s,e)=>s+e.valor,0);
    const saldo = totalEntradas - totalSaidas;
    const totalQtd = allEntries.filter(e => e.type !== "despesa").reduce((s,e)=>s+(e.qtd||0),0);

    const rows = allEntries.map(e => {
      const tipo = e.type==="porta" ? "Porta" : e.type==="janela" ? "Janela" : EXPENSE_TYPES.find(t=>t.id===e.expType)?.label||"";
      const nome = e.nome||"";
      const marc = e.marceneiro || "";
      const desc = e.desc||"";
      const forn = e.fornecedor || "";
      const parts = e.date.split("-");
      const dateShort = `${parts[2]}/${parts[1]}`;
      const qtd = e.qtd > 0 ? `${e.qtd}un` : "-";
      const val = e.type==="despesa"
        ? `- ${e.valor.toLocaleString("pt-BR")}`
        : `+ ${e.valor.toLocaleString("pt-BR")}`;
      const detalhe = nome || marc || desc || forn || "";
      return [dateShort, tipo, detalhe, qtd, val];
    });

    doc.autoTable({
      startY: 84,
      head: [["Data","Tipo","Descrição","Qtd","Valor"]],
      body: rows,
      foot: [["", "", "", totalQtd > 0 ? `${totalQtd}un` : "",
        saldo >= 0
          ? `+ ${saldo.toLocaleString("pt-BR")}`
          : `- ${Math.abs(saldo).toLocaleString("pt-BR")}`
      ]],
      styles:{ fontSize:9, cellPadding:5, textColor:[20,20,20] },
      headStyles:{
        fillColor:[255,255,255],
        textColor:[30,58,138],
        fontStyle:"bold",
        lineWidth:0.5,
        lineColor:[200,200,200]
      },
      footStyles:{
        fillColor:[255,255,255],
        textColor:[20,20,20],
        fontStyle:"bold",
        fontSize:10,
        lineWidth:0.5,
        lineColor:[200,200,200]
      },
      alternateRowStyles:{ fillColor:[245,248,255] },
      columnStyles:{
        0: { halign:"center", cellWidth:42 },
        3: { halign:"right",  cellWidth:55 },
        4: { halign:"right",  cellWidth:80 }
      },
      didParseCell: (hookData) => {
        if (hookData.column.index === 4 && hookData.section === "body") {
          const val = String(hookData.cell.raw||"");
          if (val.startsWith("+")) hookData.cell.styles.textColor = [21,128,61];
          else if (val.startsWith("-")) hookData.cell.styles.textColor = [185,28,28];
        }
        if (hookData.section === "foot") {
          if (hookData.column.index === 3) {
            hookData.cell.styles.textColor = [20, 20, 20];
            hookData.cell.styles.fontStyle = "bold";
          }
          if (hookData.column.index === 4) {
            hookData.cell.styles.textColor = saldo>=0?[21,128,61]:[185,28,28];
          }
        }
      }
    });
    compartilharPDFPortas(doc, `${especieAtiva}-${now.replace(/\//g,"-")}.pdf`);
  }

  function changeTheme(t) {
    setTheme(t);
    setShowThemePicker(false);
    try { storage.set(THEME_KEY, t.id); } catch {}
  }

  function handleAdd() {
    const valor = parseFloat(String(form.valor).replace(",", "."));
    if (!valor || isNaN(valor) || (!especieAtiva && !form.especie.trim())) return;
    const especie = (especieAtiva || form.especie.trim()).toUpperCase();

    let volM3 = 0;
    let vrM3Val = 0;
    if (form.type === "despesa" && (form.expType === "tora" || form.expType === "madeira" || form.expType === "serragem")) {
      volM3 = parseFloat(String(form.m3||"").replace(",",".")) || 0;
      vrM3Val = parseFloat(String(form.vrM3||"").replace(",",".")) || 0;
    }

    if (editingId) {
      const newEntries = data.entries.map(e => e.id === editingId ? {
        ...e, type: form.type, expType: form.expType, especie,
        nome: form.nome||"", desc: form.desc, fornecedor: form.fornecedor || "",
        marceneiro: form.marceneiro || "",
        valor,
        qtd: (form.type === "porta" || form.type === "janela") ? parseInt(form.qtd) || 0 : 0,
        date: form.date,
        volM3: volM3 || undefined,
        vrM3: vrM3Val || undefined,
      } : e);
      persist({ entries: newEntries });
      setEditingId(null);
      setEspecieAtiva(especie);
    } else {
      const entry = {
        id: Date.now(), type: form.type, expType: form.expType,
        especie, nome: form.nome||"", desc: form.desc, fornecedor: form.fornecedor || "",
        marceneiro: form.marceneiro || "",
        valor,
        qtd: (form.type === "porta" || form.type === "janela") ? parseInt(form.qtd) || 0 : 0,
        date: form.date,
        volM3: volM3 || undefined,
        vrM3: vrM3Val || undefined,
      };
      persist({ entries: [entry, ...data.entries] });
      setEspecieAtiva(entry.especie);
      setSubTab(form.type === "porta" ? "portas" : form.type === "janela" ? "janelas" : "despesas");
    }
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
    setFormDirty(false);
    setView("detail");
  }

  function handleDelete(id) {
    const remaining = data.entries.filter(e => e.especie === especieAtiva).length;
    const newData = { entries: data.entries.filter(e => e.id !== id) };
    persist(newData);
    setDeleteConfirm(null);
    if (remaining <= 1) setView("list");
  }

  function handleRenameEspecie(novoNome) {
    const novo = novoNome.trim().toUpperCase();
    if (!novo || novo === especieAtiva) { setRenamingEspecie(false); return; }
    const newEntries = data.entries.map(e => e.especie === especieAtiva ? {...e, especie: novo} : e);
    persist({ entries: newEntries });
    setEspecieAtiva(novo);
    setRenamingEspecie(false);
  }

  function handleEdit(e) {
    setEditingId(e.id);
    const qtd = e.qtd || 0;
    const valor = e.valor || 0;
    const valorUnit = (qtd > 0 && (e.type === "porta" || e.type === "janela")) ? String((valor / qtd).toFixed(2)) : "";
    const m3 = e.volM3 ? String(e.volM3) : "";

    setForm({
      type: e.type, expType: e.expType || "tora",
      especie: e.especie, nome: e.nome||"", desc: e.desc || "",
      fornecedor: e.fornecedor || "",
      marceneiro: e.marceneiro || "",
      valor: String(e.valor), qtd: String(e.qtd || ""),
      valorUnit: valorUnit,
      m3: m3,
      vrM3: e.vrM3 ? String(e.vrM3) : "",
      date: e.date
    });
    setFormDirty(true);
    setView("form");
  }

  const especies = [...new Set(data.entries.map(e => e.especie))].sort((a, b) => {
    const latestA = data.entries.filter(e => e.especie === a).map(e => e.date).sort().reverse()[0] || "";
    const latestB = data.entries.filter(e => e.especie === b).map(e => e.date).sort().reverse()[0] || "";
    return latestB.localeCompare(latestA);
  });

  function stats(esp) {
    const desp = data.entries.filter(e => e.especie === esp && e.type === "despesa").reduce((s, e) => s + e.valor, 0);
    const port = data.entries.filter(e => e.especie === esp && e.type === "porta").reduce((s, e) => s + e.valor, 0);
    const jan = data.entries.filter(e => e.especie === esp && e.type === "janela").reduce((s, e) => s + e.valor, 0);
    const qtdPort = data.entries.filter(e => e.especie === esp && e.type === "porta").reduce((s, e) => s + (e.qtd || 0), 0);
    const qtdJan = data.entries.filter(e => e.especie === esp && e.type === "janela").reduce((s, e) => s + (e.qtd || 0), 0);
    const receita = port + jan;
    const lucro = receita - desp;
    const totalQtd = qtdPort + qtdJan;
    const custoUnit = totalQtd > 0 ? desp / totalQtd : 0;
    const margemPct = receita > 0 ? (lucro / receita) * 100 : 0;
    const retornoPct = desp > 0 ? (lucro / desp) * 100 : 0;
    const lucroPorPorta = qtdPort > 0 ? lucro / qtdPort : 0;
    return { desp, port, jan, receita, lucro, qtdPort, qtdJan, totalQtd, custoUnit, margemPct, retornoPct, lucroPorPorta };
  }

  const totalDesp = data.entries.filter(e => e.type === "despesa").reduce((s, e) => s + e.valor, 0);
  const totalPort = data.entries.filter(e => e.type === "porta").reduce((s, e) => s + e.valor, 0);
  const totalJan = data.entries.filter(e => e.type === "janela").reduce((s, e) => s + e.valor, 0);
  const totalReceita = totalPort + totalJan;
  const lucroGeral = totalReceita - totalDesp;
  const totalQtdGeralPort = data.entries.filter(e => e.type === "porta").reduce((s, e) => s + (e.qtd || 0), 0);
  const totalQtdGeralJan = data.entries.filter(e => e.type === "janela").reduce((s, e) => s + (e.qtd || 0), 0);
  const totalQtdGeral = totalQtdGeralPort + totalQtdGeralJan;

  const totalEntriesInTab = useMemo(() => {
    if (!especieAtiva) return 0;
    return data.entries.filter(e =>
      e.especie === especieAtiva &&
      e.type === (subTab === "portas" ? "porta" : subTab === "janelas" ? "janela" : "despesa") &&
      (subTab !== "despesas" || !filterType || e.expType === filterType) &&
      (!filterDoorName || e.nome === filterDoorName)
    ).length;
  }, [data.entries, especieAtiva, subTab, filterType, filterDoorName]);

  const entriesAtivas = useMemo(() => {
    if (!especieAtiva) return [];
    const filtered = data.entries
      .filter(e => e.especie === especieAtiva && e.type === (subTab === "portas" ? "porta" : subTab === "janelas" ? "janela" : "despesa")
        && (subTab !== "despesas" || !filterType || e.expType === filterType)
        && (!filterDoorName || e.nome === filterDoorName))
      .sort((a, b) => b.date.localeCompare(a.date));

    if (!searchText.trim()) return filtered;
    const term = searchText.trim().toLowerCase();
    return filtered.filter(e => 
      (e.nome || "").toLowerCase().includes(term) ||
      (e.desc || "").toLowerCase().includes(term) ||
      (e.fornecedor || "").toLowerCase().includes(term) ||
      (e.marceneiro || "").toLowerCase().includes(term) ||
      String(e.valor).includes(term)
    );
  }, [data.entries, especieAtiva, subTab, filterType, filterDoorName, searchText]);

  const filteredTotal = useMemo(() => {
    return entriesAtivas.reduce((sum, e) => sum + (e.valor || 0), 0);
  }, [entriesAtivas]);

  const statsAtiva = especieAtiva ? stats(especieAtiva) : null;

  if (loading) return <div style={s.loadWrap}><div style={s.spinner} /></div>;

  // FORM
  if (view === "form") return (
    <div style={s.root}>
      <div style={{...s.header, background:`linear-gradient(135deg, ${theme.a} 0%, ${theme.b} 60%, ${theme.a}cc 100%)`}}>
        <button style={s.backBtn} onClick={() => { if (formDirty && !confirm("Descartar alterações não salvas?")) return; setFormDirty(false); setView(especieAtiva ? "detail" : "list"); }}>‹</button>
        <span style={s.headerTitle}>{editingId ? "Editar Lançamento" : "Novo Lançamento"}</span>
      </div>
      <div style={s.page}>
        <div style={s.toggleRow}>
          <button style={{...s.toggleBtn, ...(form.type==="despesa"?s.tOrange:{})}} onClick={() => { setForm(f=>({...f,type:"despesa",valor:"",qtd:"",valorUnit:""})); setFormDirty(true); }}>💸 Despesa</button>
          <button style={{...s.toggleBtn, ...(form.type==="porta"?s.tGreen:{})}} onClick={() => { setForm(f=>({...f,type:"porta",valor:"",qtd:"",valorUnit:""})); setFormDirty(true); }}>🚪 Porta</button>
          <button style={{...s.toggleBtn, ...(form.type==="janela"?s.tBlue:{})}} onClick={() => { setForm(f=>({...f,type:"janela",valor:"",qtd:"",valorUnit:""})); setFormDirty(true); }}>🪟 Janela</button>
        </div>

        {especieAtiva ? (
          <div style={s.especieFixaBadge}>🌿 {especieAtiva}</div>
        ) : (
          <>
            <div style={s.label}>Espécie da Madeira *</div>
            <input style={s.input} type="text" placeholder="Ex: Amarelão, Jatobá..." value={form.especie} onChange={e => { setForm(f=>({...f,especie:e.target.value})); setFormDirty(true); }} />
          </>
        )}

        <div style={s.label}>Data</div>
        <input style={{...s.input, colorScheme:"dark"}} type="date" value={form.date} onChange={e => { setForm(f=>({...f,date:e.target.value})); setFormDirty(true); }} />

        {form.type === "despesa" && (
          <>
            <div style={s.label}>Tipo de Despesa</div>
            <div style={s.expGrid}>
              {EXPENSE_TYPES.map(t => (
                <button key={t.id} style={{...s.expBtn, ...(form.expType===t.id?s.expActive:{})}} onClick={() => { setForm(f=>({...f,expType:t.id,m3:"",vrM3:"",valor:""})); setFormDirty(true); }}>
                  <span style={{fontSize:16}}>{t.emoji}</span>
                  <span style={{fontSize:10,marginTop:2}}>{t.label}</span>
                </button>
              ))}
            </div>

            <div style={s.label}>Fornecedor (opcional)</div>
            <input style={s.input} type="text" placeholder="Ex: Serraria Vitória" value={form.fornecedor} onChange={e => { setForm(f=>({...f,fornecedor:e.target.value})); setFormDirty(true); }} />

            {(form.expType==="tora"||form.expType==="madeira"||form.expType==="serragem") && (
              <div style={s.m3Calc}>
                <div style={s.m3CalcTitle}>📐 Calculadora M³ — {EXPENSE_TYPES.find(t=>t.id===form.expType)?.label}</div>
                <div style={s.m3Row}>

                    <span style={s.m3Label}>Quantidade (m³)</span>
                    <input
                      style={s.m3Input}
                      type="number" inputMode="decimal"
                      placeholder="Ex: 10"
                      value={form.m3||""}
                      onChange={e => {
                        const m3 = e.target.value;
                        const m3Num = parseFloat(String(m3).replace(",",".")) || 0;
                        const vrNum = parseFloat(String(form.vrM3||"").replace(",",".")) || 0;
                        const total = (m3Num && vrNum) ? String((m3Num * vrNum).toFixed(2)) : form.valor;
                        setForm(f=>({...f, m3, valor: total}));
                        setFormDirty(true);
                      }}
                    />
                  </div>
                  <span style={s.m3X}>×</span>
                  <div style={s.m3Col}>
                    <span style={s.m3Label}>R$ por m³</span>
                    <input
                      style={s.m3Input}
                      type="number" inputMode="decimal"
                      placeholder={form.expType==="serragem"?"Ex: 220":"Ex: 600"}
                      value={form.vrM3||""}
                      onChange={e => {
                        const vr = e.target.value;
                        const vrNum = parseFloat(String(vr).replace(",",".")) || 0;
                        const m3Num = parseFloat(String(form.m3||"").replace(",",".")) || 0;
                        const total = (vrNum && m3Num) ? String((m3Num * vrNum).toFixed(2)) : form.valor;
                        setForm(f=>({...f, vrM3: vr, valor: total}));
                        setFormDirty(true);
                      }}
                    />
                  </div>
                </div>
                {(form.m3 && form.vrM3) && (
                  <div style={s.m3Result}>
                    {parseFloat(String(form.m3).replace(",",".")).toLocaleString("pt-BR")} m³ × {formatBRL(parseFloat(String(form.vrM3).replace(",",".")))} = <strong style={{color:"#4ade80"}}>{formatBRL(parseFloat(String(form.m3).replace(",","."))*parseFloat(String(form.vrM3).replace(",",".")))}</strong>
                  </div>
                )}
              </div>
            )}
          </>
        )}

        {(form.type === "porta" || form.type === "janela") && (
          <>
            <div style={s.label}>Nome da {form.type==="janela"?"Janela":"Porta"}</div>
            <input style={s.input} type="text" placeholder="Ex: Americana, Tijolinho, Diagonal..." value={form.nome||""} onChange={e => { setForm(f=>({...f,nome:e.target.value})); setFormDirty(true); }} />
            <div style={s.label}>Quantidade de {form.type==="janela"?"Janelas":"Portas"}</div>
            <input style={s.input} type="number" inputMode="numeric" placeholder="Ex: 400" value={form.qtd}
              onChange={e => {
                const qtd = e.target.value;
                const unitNum = parseFloat(String(form.valorUnit||"").replace(",",".")) || 0;
                const qtdNum = parseInt(qtd) || 0;
                setForm(f=>({...f, qtd, valor: (unitNum && qtdNum) ? String((unitNum * qtdNum).toFixed(2)) : f.valor}));
                setFormDirty(true);
              }} />
            <div style={s.label}>Valor por {form.type==="janela"?"Janela":"Porta"} (R$)</div>
            <input style={s.input} type="number" inputMode="decimal" placeholder="Ex: 150" value={form.valorUnit||""}
              onChange={e => {
                const unit = e.target.value;
                const unitNum = parseFloat(String(unit).replace(",",".")) || 0;
                const qtdNum = parseInt(form.qtd)||0;
                setForm(f=>({...f, valorUnit:unit, valor:(unitNum && qtdNum) ? String((unitNum * qtdNum).toFixed(2)) : f.valor}));
                setFormDirty(true);
              }} />
            {(form.qtd && form.valorUnit) && (
              <div style={s.calcPreview}>
                {form.qtd} × {formatBRL(parseFloat(String(form.valorUnit||0).replace(",",".")))} = <strong>{formatBRL(parseFloat(String(form.valorUnit||0).replace(",","."))*(parseInt(form.qtd)||0))}</strong>
              </div>
            )}
            <div style={s.label}>Valor Total (R$) *</div>
            <input style={s.input} type="number" inputMode="decimal" placeholder="Calculado automaticamente" value={form.valor} onChange={e => { setForm(f=>({...f,valor:e.target.value})); setFormDirty(true); }} />

            <div style={s.label}>Marceneiro</div>
            <input style={s.input} type="text" placeholder="Ex: João, Pedro..." value={form.marceneiro||""} onChange={e => { setForm(f=>({...f,marceneiro:e.target.value})); setFormDirty(true); }} />

            <div style={s.label}>Observação (opcional)</div>
            <input style={s.input} type="text" placeholder="Ex: Cliente João" value={form.desc} onChange={e => { setForm(f=>({...f,desc:e.target.value})); setFormDirty(true); }} />
          </>
        )}

        {form.type === "despesa" && (
          <>
            <div style={s.label}>Valor (R$) *</div>
            <input style={s.input} type="number" inputMode="decimal" placeholder="Ex: 50000" value={form.valor} onChange={e => { setForm(f=>({...f,valor:e.target.value})); setFormDirty(true); }} />
          </>
        )}

        <button style={{...s.btnSave, opacity:(form.valor&&(especieAtiva||form.especie.trim()))?1:0.4}}
          onClick={handleAdd} disabled={!form.valor||(!especieAtiva&&!form.especie.trim())}>
          {editingId ? "✅ Salvar Edição" : "✅ Salvar Lançamento"}
        </button>
        <button style={s.btnCancel} onClick={() => { if (formDirty && !confirm("Descartar alterações não salvas?")) return; setFormDirty(false); setView(especieAtiva?"detail":"list"); }}>Cancelar</button>
        <div style={{height:30}} />
      </div>
    </div>
  );

  // DETAIL
  if (view === "detail" && especieAtiva && statsAtiva) return (
    <div style={s.root}>
      <div style={{
        ...s.header,
        background:`linear-gradient(135deg, ${theme.a} 0%, ${theme.b} 60%, ${theme.a}cc 100%)`,
        position:"sticky", top:0, zIndex:20,
        transform: headerVisible ? "translateY(0)" : "translateY(-100%)",
        transition: "transform 0.3s ease"
      }}>
        {renamingEspecie ? (
          <div style={{display:"flex",alignItems:"center",gap:6,flex:1}}>
            <input
              autoFocus
              style={{...s.input, padding:"6px 10px", fontSize:14, fontWeight:800, flex:1, margin:0, borderColor:"#6366f1"}}
              value={renameValue}
              onChange={e => setRenameValue(e.target.value)}
              onKeyDown={e => { if(e.key==="Enter") handleRenameEspecie(renameValue); if(e.key==="Escape") setRenamingEspecie(false); }}
            />
            <button style={{background:"#4f46e5",border:"none",borderRadius:8,padding:"6px 12px",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}
              onClick={()=>handleRenameEspecie(renameValue)}>OK</button>
            <button style={{background:"#374151",border:"none",borderRadius:8,padding:"6px 10px",color:"#9ca3af",fontWeight:700,fontSize:13,cursor:"pointer"}}
              onClick={()=>setRenamingEspecie(false)}>✕</button>
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{
              background:"rgba(59,130,246,0.15)",
              border:"1px solid rgba(59,130,246,0.35)",
              borderRadius:8,
              padding:"5px 14px",
              fontSize:15, fontWeight:800, color:"#93c5fd", letterSpacing:0.3
            }}>{especieAtiva}</div>
            <button
              title="Renomear espécie"
              style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"5px 8px",color:"#cbd5e1",fontSize:14,cursor:"pointer",lineHeight:1}}
              onClick={()=>{ setRenameValue(especieAtiva); setRenamingEspecie(true); }}>✏️</button>
          </div>
        )}
        <button style={{...s.backBtn, marginLeft:"auto"}} onClick={() => setView("list")}>›</button>
      </div>
      {saved && <div style={s.toast}>✅ Lançamento salvo!</div>}
      <div style={s.detailHeader}>
        <div style={s.detailRow1}>
          <div style={s.detailMini}>
            <span style={s.detailMiniLabel}>🚪 portas</span>
            <span style={{...s.detailMiniVal, color:"#22c55e"}}>{statsAtiva.qtdPort>0?`${statsAtiva.qtdPort} un`:"—"}</span>
          </div>
          <div style={s.detailMiniDiv}/>
          <div style={s.detailMini}>
            <span style={s.detailMiniLabel}>🪟 janelas</span>
            <span style={{...s.detailMiniVal, color:"#60b4f7"}}>{statsAtiva.qtdJan>0?`${statsAtiva.qtdJan} un`:"—"}</span>
          </div>
          <div style={s.detailMiniDiv}/>
          <div style={{...s.detailMini, flex:2}}>
            <span style={s.detailMiniLabel}>{statsAtiva.lucro>=0?"LUCRO":"PREJUÍZO"}</span>
            <span style={{...s.detailLucroVal, color:statsAtiva.lucro>=0?"#22c55e":"#ff6b6b"}}>{formatBRLInt(Math.abs(statsAtiva.lucro))}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:4,flexWrap:"wrap"}}>
          <span style={{fontSize:14,color:"#9ca3af",background:"#111827",padding:"6px 14px",borderRadius:8,fontWeight:700}}>
            Margem: <span style={{color:statsAtiva.lucro>=0?"#22c55e":"#ff6b6b",fontWeight:900,fontSize:15}}>{statsAtiva.margemPct.toFixed(1)}%</span>
          </span>
          {statsAtiva.totalQtd > 0 && (
            <span style={{fontSize:14,color:"#9ca3af",background:"#111827",padding:"6px 14px",borderRadius:8,fontWeight:700}}>
              Custo/un: <span style={{color:"#e5e7eb",fontWeight:900,fontSize:15}}>{formatBRL(statsAtiva.custoUnit)}</span>
            </span>
          )}
          {statsAtiva.desp > 0 && (
            <span style={{fontSize:14,color:"#9ca3af",background:"#111827",padding:"6px 14px",borderRadius:8,fontWeight:700}}>
              Retorno: <span style={{color:statsAtiva.lucro>=0?"#22c55e":"#ff6b6b",fontWeight:900,fontSize:15}}>{statsAtiva.retornoPct.toFixed(1)}%</span>
            </span>
          )}
          {statsAtiva.qtdPort > 0 && (
            <span style={{fontSize:14,color:"#9ca3af",background:"#111827",padding:"6px 14px",borderRadius:8,fontWeight:700}}>
              Lucro/porta: <span style={{color:statsAtiva.lucro>=0?"#22c55e":"#ff6b6b",fontWeight:900,fontSize:15}}>{formatBRL(statsAtiva.lucroPorPorta)}</span>
            </span>
          )}
        </div>
        <BarChart desp={statsAtiva.desp} receita={statsAtiva.receita} lucro={statsAtiva.lucro} theme={theme} />
        <div style={s.detailRow2}>
          <button style={{...s.detailTabBtn, ...(subTab==="despesas"?{borderBottom:"2px solid #fb923c"}:{})}}
            onClick={()=>{setSubTab("despesas");setFilterDoorName(null);setFilterType(null);setSearchText("");}}>
            <span style={s.detailValLabel}>Despesas</span>
            <span style={{...s.detailValNum, color:"#ff6b6b"}}>{(subTab==="despesas"&&filterType)?formatBRLInt(filteredTotal):formatBRLInt(statsAtiva.desp)}</span>
          </button>
          <button style={{...s.detailTabBtn, ...(subTab==="portas"?{borderBottom:"2px solid #4ade80"}:{})}}
            onClick={()=>{setSubTab("portas");setFilterDoorName(null);setFilterType(null);setSearchText("");}}>
            <span style={s.detailValLabel}>Portas</span>
            <span style={{...s.detailValNum, color:"#22c55e"}}>{(subTab==="portas"&&filterDoorName)?formatBRLInt(filteredTotal):formatBRLInt(statsAtiva.port)}</span>
          </button>
          <button style={{...s.detailTabBtn, ...(subTab==="janelas"?{borderBottom:"2px solid #60b4f7"}:{})}}
            onClick={()=>{setSubTab("janelas");setFilterDoorName(null);setFilterType(null);setSearchText("");}}>
            <span style={s.detailValLabel}>Janelas</span>
            <span style={{...s.detailValNum, color:"#60b4f7"}}>{(subTab==="janelas"&&filterDoorName)?formatBRLInt(filteredTotal):formatBRLInt(statsAtiva.jan)}</span>
          </button>
        </div>
      </div>

      <div style={s.page}>
        {totalEntriesInTab > 5 && (
          <div style={{marginBottom:10}}>
            <input
              style={{...s.input, padding:"10px 12px", fontSize:14}}
              type="text"
              placeholder="🔍 Buscar nesta lista..."
              value={searchText}
              onChange={e => setSearchText(e.target.value)}
            />
          </div>
        )}
        {(filterDoorName || filterType) && (
          <div style={s.filterActiveBar}>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span>Filtrando: <strong>{filterDoorName || EXPENSE_TYPES.find(t=>t.id===filterType)?.label}</strong></span>
              <span style={{fontSize:13,color:"#4ade80",fontWeight:800}}>
                Total: {formatBRL(filteredTotal)}
              </span>
            </div>
            <button style={s.filterClearBtn} onClick={()=>{setFilterDoorName(null);setFilterType(null);}}>✕ limpar</button>
          </div>
        )}
        {entriesAtivas.length===0 ? (
          <div style={s.emptySmall}>Nenhum lançamento de {subTab} para {especieAtiva}.</div>
        ) : (
          (() => {
            let lastMonth = "";
            return entriesAtivas.map(e => {
              const month = e.date.slice(0, 7);
              const showMonth = month !== lastMonth;
              lastMonth = month;
              return (
                <React.Fragment key={e.id}>
                  {showMonth && <MonthSeparator date={e.date} />}
                  <EntryCard
                    e={e}
                    deleteConfirm={deleteConfirm} setDeleteConfirm={setDeleteConfirm}
                    handleDelete={handleDelete} handleEdit={handleEdit}
                    filterType={filterType} setFilterType={setFilterType}
                    filterDoorName={filterDoorName} setFilterDoorName={setFilterDoorName}
                  />
                </React.Fragment>
              );
            });
          })()
        )}
      </div>
      <div style={s.fabAreaRight}>
        <div style={s.fabMiniRow}>
          <button style={s.fabMiniBtn} onClick={exportPDFEspecie} title="Exportar PDF">📄</button>
          <button style={s.fabMiniBtn} onClick={()=>setShowThemePicker(p=>!p)} title="Cor">🎨</button>
        </div>
        <button style={s.fabSmall} onClick={() => {
          setEditingId(null);
          setForm(f=>({...f, especie:especieAtiva, type:subTab==="portas"?"porta":subTab==="janelas"?"janela":"despesa", valor:"", qtd:"", valorUnit:"", m3:"", vrM3:"", desc:"", fornecedor:"", marceneiro:"", date:today()}));
          setFormDirty(false);
          setView("form");
        }}>+</button>
      </div>
    </div>
  );

  // LIST
  return (
    <div style={s.root}>
      <div style={{
        ...s.headerGrad,
        background:`linear-gradient(135deg, ${theme.a} 0%, ${theme.b} 60%, ${theme.a}cc 100%)`,
        transform:headerVisible?"translateY(0)":"translateY(-100%)",
        transition:"transform 0.3s ease"
      }}>
        <div style={s.headerCardsRow}>
          <div style={s.cardAmarelo}>
            <div style={s.cardAntLabel}>DESPESAS TOTAIS</div>
            <div style={s.cardAntVal}>{formatBRLInt(totalDesp)}</div>
            <div style={s.cardAntDivider} />
            <div style={s.cardAntLabel}>RECEITA TOTAL</div>
            <div style={{...s.cardAntVal, color:"#22c55e", fontSize:18}}>{formatBRLInt(totalReceita)}</div>
          </div>
          <div style={{...s.cardBranco, border:"none", boxShadow: lucroGeral>=0 ? "0 0 12px 2px rgba(34,197,94,0.25)" : "0 0 12px 2px rgba(255,100,100,0.25)"}}>
            <div style={s.cardBrancoLabel}>{lucroGeral>=0?"✅ Lucro Geral":"⚠️ Prejuízo"}</div>
            <div style={{...s.cardBrancoVal, color: lucroGeral>=0?"#22c55e":"#ff6b6b"}}>
              {formatBRLInt(Math.abs(lucroGeral))}
            </div>
            {totalQtdGeral > 0 && (
              <div style={{fontSize:11,color:"#9ca3af",marginTop:4}}>
                {totalQtdGeral} un vendidas · {formatBRL(lucroGeral / totalQtdGeral)}/un
              </div>
            )}
          </div>
        </div>

        {showThemePicker && (
          <div style={s.themePickerPanel}>
            <div style={s.themePickerTitle}>🎨 Escolha uma cor</div>
            <div style={s.themeGrid}>
              {THEMES.map(t => (
                <button key={t.id} style={{...s.themeSwatchBtn, ...(theme.id===t.id?s.themeSwatchActive:{})}}
                  onClick={()=>changeTheme(t)}>
                  <div style={{...s.themeSwatch, background:`linear-gradient(135deg,${t.a},${t.b})`}}/>
                  <span style={s.themeSwatchLabel}>{t.label}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        <div style={s.mainTabRow}>
          <button style={{...s.mainTab, ...(mainTab==="especies"?s.mainTabActive:{})}} onClick={()=>setMainTab("especies")}>Espécies</button>
          <button style={{...s.mainTab, ...(mainTab==="resumo"?s.mainTabActive:{})}} onClick={()=>setMainTab("resumo")}>Resumo</button>
        </div>
      </div>

      {saved && <div style={s.toast}>✅ Salvo!</div>}

      {mainTab==="especies" && (
        <div style={s.listPage}>
          {especies.length===0 ? (
            <div style={s.empty}>Nenhuma espécie cadastrada.<br/>Toque em <b>+</b> para começar.</div>
          ) : especies.map(esp => {
            const st = stats(esp);
            return (
              <EspecieCard
                key={esp} esp={esp} st={st}
                onOpen={()=>{setEspecieAtiva(esp);setSubTab("despesas");setView("detail");}}
                onDelete={()=>{ persist({entries:data.entries.filter(e=>e.especie!==esp)}); }}
                formatBRLInt={formatBRLInt} formatBRL={formatBRL}
              />
            );
          })}
        </div>
      )}

      {mainTab==="resumo" && (
        <div style={s.listPage}>
          <div style={s.resumoCard}>
            <div style={s.resumoRow}><span style={s.resumoLabel}>Total Despesas</span><span style={{...s.resumoVal,color:"#ff6b6b"}}>{formatBRL(totalDesp)}</span></div>
            <div style={s.resumoRow}><span style={s.resumoLabel}>🚪 Total Portas</span><span style={{...s.resumoVal,color:"#22c55e"}}>{formatBRL(totalPort)} {totalQtdGeralPort>0&&`(${totalQtdGeralPort} un)`}</span></div>
            <div style={s.resumoRow}><span style={s.resumoLabel}>🪟 Total Janelas</span><span style={{...s.resumoVal,color:"#60b4f7"}}>{formatBRL(totalJan)} {totalQtdGeralJan>0&&`(${totalQtdGeralJan} un)`}</span></div>
            <div style={{...s.resumoRow,borderTop:"1px solid #333",paddingTop:12,marginTop:4}}>
              <span style={{...s.resumoLabel,fontWeight:800,color:"#fff"}}>{lucroGeral>=0?"Lucro":"Prejuízo"}</span>
              <span style={{...s.resumoVal,color:lucroGeral>=0?"#22c55e":"#ff6b6b",fontWeight:900,fontSize:22}}>{formatBRL(Math.abs(lucroGeral))}</span>
            </div>
            {totalQtdGeral > 0 && (
              <div style={{...s.resumoRow,marginTop:4}}>
                <span style={{...s.resumoLabel,color:"#6b7280"}}>Lucro médio por unidade</span>
                <span style={{...s.resumoVal,color:lucroGeral>=0?"#22c55e":"#ff6b6b",fontSize:16}}>{formatBRL(lucroGeral / totalQtdGeral)}</span>
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginBottom:16}}>
            <button style={{flex:1,background:"#1f2937",border:"1.5px solid #374151",borderRadius:12,padding:"12px",color:"#e5e7eb",fontWeight:700,fontSize:13,cursor:"pointer"}}
              onClick={exportBackup}>💾 Exportar Backup</button>
            <button style={{flex:1,background:"#1f2937",border:"1.5px solid #374151",borderRadius:12,padding:"12px",color:"#e5e7eb",fontWeight:700,fontSize:13,cursor:"pointer"}}
              onClick={()=>fileInputRef.current?.click()}>📁 Restaurar Backup</button>
            <input ref={fileInputRef} type="file" accept=".json" style={{display:"none"}} onChange={e => { if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=""; }} />
          </div>

          {especies.length>0 && (
            <>
              <div style={s.resumoSectionTitle}>Por Espécie</div>
              {especies.map(esp => {
                const st = stats(esp);
                return (
                  <div key={esp} style={s.resumoEspCard}>
                    <div style={s.resumoRow}><span style={{color:"#fff",fontWeight:700,fontSize:15}}>{esp}</span><span style={{color:st.lucro>=0?"#22c55e":"#ff6b6b",fontWeight:800}}>{st.lucro>=0?"+":"-"} {formatBRL(Math.abs(st.lucro))}</span></div>
                    <div style={s.resumoRow}><span style={s.resumoLabel}>Despesas</span><span style={{color:"#ff6b6b",fontWeight:600}}>{formatBRL(st.desp)}</span></div>
                    <div style={s.resumoRow}><span style={s.resumoLabel}>🚪 Portas{st.qtdPort>0?` (${st.qtdPort} un)`:""}</span><span style={{color:"#22c55e",fontWeight:600}}>{formatBRL(st.port)}</span></div>
                    <div style={s.resumoRow}><span style={s.resumoLabel}>🪟 Janelas{st.qtdJan>0?` (${st.qtdJan} un)`:""}</span><span style={{color:"#60b4f7",fontWeight:600}}>{formatBRL(st.jan)}</span></div>
                    {st.totalQtd > 0 && (
                      <div style={s.resumoRow}>
                        <span style={{...s.resumoLabel,color:"#6b7280"}}>Custo/un · Margem</span>
                        <span style={{color:"#9ca3af",fontWeight:600,fontSize:13}}>{formatBRL(st.custoUnit)} · {st.margemPct.toFixed(1)}%</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}

      <div style={s.fabAreaRight}>
        <div style={s.fabMiniRow}>
          <button style={s.fabMiniBtn} onClick={exportPDF} title="Exportar PDF">📄</button>
          <button style={s.fabMiniBtn} onClick={()=>setShowThemePicker(p=>!p)} title="Cor">🎨</button>
        </div>
        <button style={s.fabSmall} onClick={()=>{setEspecieAtiva(null);setEditingId(null);setForm({type:"despesa",expType:"tora",especie:"",nome:"",desc:"",fornecedor:"",marceneiro:"",valor:"",qtd:"",valorUnit:"",m3:"",vrM3:"",date:today()});setFormDirty(false);setView("form");}}>+</button>
      </div>
    </div>
  );
}

function compartilharPDFPortas(doc, fileName) {
  const blob = doc.output('blob');
  const file = new File([blob], fileName, {type:'application/pdf'});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:'Controle de Portas'}).catch(()=>{});
  } else {
    const dataUri = doc.output('datauristring');
    const a = document.createElement('a');
    a.href = dataUri; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}
